[lobby]
shared_room = '''
ルーム名が一致したユーザーと対戦します。
接続を待っている間も CPU 戦など他の機能を使用できます。
通常はこちらを使用してください。'''
reserved_room = '''
ルーム名が一致したユーザーと対戦します。
観戦機能が使用できます。'''
tcp_signaling = '''
接続サーバーを使わず、TCP で直接接続情報を交換します。
既定では STUN サーバーを使用するため、
シグナリングサーバーの提供終了後もこの方式で対戦できます。
片方が設定したポートで待ち受け、
もう片方がそのアドレスへ接続します。'''
pure_p2p = '''
接続サーバーを使わず、
外部のチャットなどを介して対戦相手と接続します。'''
shared_room_waiting = '''
　　　決定ボタン: 対戦を中止する
キャンセルボタン: 対戦待ちのままタイトルに戻る'''
tcp_signaling_waiting = '''
　　　決定ボタン: 対戦を中止する
キャンセルボタン: 対戦待ちのままタイトルに戻る'''
tcp_signaling_offline_mode = '''
「Offline Mode」を ON にすると STUN サーバーを
使わなくなります。LAN 内などインターネットに
接続できない環境で便利です。'''
