[workspace]
members = [
  "archives/th19netdelayemulate",
  "archives/th19onlinevsfix",
  "archives/th19padlight",
  "archives/th19replayplayer",
  "archives/th19replayplayer-lib",
  "archives/th19replayrecorder",
  "archives/th19savesettingsseparately",
  "archives/th19seed",
  "junowen",
  "junowen-lib",
  "junowen-server",
  "th19loader",
]
default-members = ["junowen"]
resolver = "2"

[workspace.package]
version = "1.2.0"
authors = ["Progre"]
license = "GPL-3.0"

[workspace.dependencies]
anyhow = { version = "1.0.95", features = ["backtrace"] }
async-trait = "0.1.85"
bytes = "1.9.0"
clipboard-win = "5.4.0"
junowen-lib = { path = "./junowen-lib" }
rmp-serde = "1.3.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
static_vcruntime = "2.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = [
  "rt",
  "macros",
  "rt-multi-thread",
  "time",
] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
  "env-filter",
  "local-time",
] }
windows = { version = "0.59.0", features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D9",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.59.0"
